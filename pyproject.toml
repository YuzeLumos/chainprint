[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainprint-candidate"
version = "0.1.0"
description = "Portable CPU interfaces for the frozen ChainPrint paired-operation estimator"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "Pillow>=11,<13", "torch>=2.9,<2.12"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
plots = ["matplotlib>=3.10,<3.12"]
ai = ["diffusers==0.36.0", "transformers", "accelerate", "safetensors"]

[project.scripts]
chainprint = "chainprint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["ai_operator", "gain_block", "chainprint_shared_residual", "opweave_frozen_20260916", "final_local_extension", "joint_block_cache", "threshold_block", "extended_mixed_estimator", "unit_gain_extension", "integer_local_response", "mixed_estimator", "support_correction_pool", "joint_fit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chainprint = ["assets/*.json", "assets/models/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
